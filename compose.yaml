name: researchos

services:
  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: researchos
      POSTGRES_USER: researchos_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researchos_user -d researchos"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://researchos_user:${POSTGRES_PASSWORD}@db:5432/researchos
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.docker}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
      CROSSREF_MAILTO: ${CROSSREF_MAILTO:-}
      UPLOAD_DIR: /app/uploads
    volumes:
      - research_files:/app/uploads
      - research_reports:/app/reports
      - model_cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://researchos_user:${POSTGRES_PASSWORD}@db:5432/researchos
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.docker}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
      CROSSREF_MAILTO: ${CROSSREF_MAILTO:-}
      UPLOAD_DIR: /app/uploads
    volumes:
      - research_files:/app/uploads
      - research_reports:/app/reports
      - model_cache:/root/.cache/huggingface
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://api:8000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  research_files:
  research_reports:
  model_cache:
